<div class="header">
  <div class="application-title">
    <span class="title">{{ title }}</span>
    <span class="environment">{{ environment }}</span>
  </div>
</div>

<div class="body">
  <div class="nav-items">
    @for (item of menuItems; track item) {
      @if (item.type == 'router-link') {
        <a class="nav-item"
          [routerLink]="item.route"
          [class.active]="item.isActive"
          [class.indented]="item.indented"
          [matTooltip]="item.title"
          [matTooltipDisabled]="isExpanded"
          [matTooltipShowDelay]="tooltipShowDelay"
          matTooltipClass="pit-menu-tooltip"
          matTooltipPosition="right"
          (click)="onItemClick( item )"
          >
          <pit-icon
            [iconName]="item.iconName"
            iconSize="small"
          ></pit-icon>
          <span class="label">{{ item.title }}</span>
        </a>
      }
    }
  </div>
</div>

<div class="footer">
  <div class="toggle-button" (click)="onToggleClick()">
    <pit-icon
      iconName="double_arrow"
      [title]="toggleTitle"
      iconSize="small"
    ></pit-icon>
  </div>

  <div class="system-and-user-info">
    <div class="userNameWrapper">
      <pit-icon
        iconName="account_circle"
        iconSize="small"
      ></pit-icon>
      <span class="userName">{{ userName }}</span>
    </div>
    @if (actingOnBehalfOf) {
      <div class="actingOnBehalfOfWrapper">
        <span class="actingOnBehalfOf">Acting on behalf of:</span>
        <span>{{ actingOnBehalfOf }}</span>
      </div>
    }
  </div>

  <div class="version">
    <div class="short" [title]="'Version ' + version.long">v{{ version.short }}</div>
    <div class="long">Version {{ version.long }}</div>
  </div>

  <ng-container>
    <ng-content select=[menu-footer]></ng-content>
  </ng-container>
</div>
